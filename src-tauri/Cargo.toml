[package]
name = "mithril-vault"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mithril_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["test"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-stronghold = { version = "2", features = ["kdf"] }
iota_stronghold = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "webp", "pnm", "tiff"] }
sha2 = "0.11"
url = "2"
uuid = { version = "1", features = ["v4"] }

# KDBX (KeePass) database support
# save_kdbx4 enables database creation and saving functionality
keepass = { version = "0.13", features = ["save_kdbx4", "_merge"] }
# Required for KDF configuration (Argon2id version parameter) - must match keepass's dependency
rust-argon2 = "3.0"

# Clipboard support
arboard = "3"
tokio = { version = "1", features = ["time", "rt"] }
chrono = { version = "0.4", features = ["serde"] } # Timestamp handling
psl = "2"
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
fs4 = { version = "1.1", features = ["sync"] }
# Password Health analyzer's strength check (zxcvbn score 0/1).
# Entropy/pattern detection only; no network.
zxcvbn = "3"
# Password Health reuse grouping. Keyed BLAKE3 with a fresh random key
# generated per analysis run — the hash is never persisted and the key
# is dropped with the analyzer's stack frame.
blake3 = "1.8.5"

[profile.dev.package.scrypt]
opt-level = 3

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "warn"
unused = "warn"


[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
cargo_common_metadata = "allow"

# Temporary fork of keepass 0.13.14 that retains attachment binaries referenced
# by historical entry versions instead of garbage-collecting them on the last
# *live* reference. Stock 0.13.x GCs a blob keyed by entry_id only (ignoring the
# history index) and reuses the freed AttachmentId on the next add, which
# corrupts Entry History on attachment delete (#332). The fork drops only the
# exact live forward reference (mirroring set_icon_none), derives referrers from
# forward references rather than a stale cache, and prunes/re-indexes the pool at
# save time. It also fixes the matching custom-icon stale-history-index bug,
# hardening the existing custom-icon snapshot path. This fork commit merges
# upstream v0.13.14, including the quick-xml 0.41 audit fix. The -mv.2 release
# additionally implements the merge's attachment TODO: source-newer updates and
# new-from-source entries (and their history versions) get their attachment
# bytes imported into the destination pool with ids remapped, and entry
# divergence compares attachments by (name, bytes) instead of raw pool ids
# (SchnitzelAndSpaetzle/keepass-rs#11). To be dropped once the fixes are
# released upstream.
[patch.crates-io]
keepass = { git = "https://github.com/SchnitzelAndSpaetzle/keepass-rs", tag = "v0.13.14-mv.2" }

name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  # Override target-cpu=native from .cargo/config.toml for CI compatibility
  RUSTFLAGS: "-C target-cpu=generic"

jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      # Resolved here (where the `secrets` context is allowed) so the step-level
      # `if:` below can check it via the `env` context. Holds only "true"/"false";
      # the actual token stays scoped to the Sonar step.
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Frontend coverage
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install

      - name: Run frontend tests with coverage
        run: bun run test:coverage

      # Backend coverage
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libglib2.0-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Run Rust tests with coverage
        working-directory: src-tauri
        # Use --release to speed up Argon2 key derivation in KDBX tests
        run: cargo llvm-cov --release --lcov --output-path rust-lcov.info

      - name: SonarQube Cloud scan
        # Skip on fork PRs and Dependabot runs where SONAR_TOKEN isn't available;
        # otherwise the step would fail and turn the whole Coverage job red.
        # The `secrets` context isn't allowed in step-level `if:`, so the guard
        # is resolved to a boolean via the job-level `HAS_SONAR_TOKEN` env var.
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Upload to Codecov
      - name: Upload frontend coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./coverage/lcov.info
          flags: frontend
          fail_ci_if_error: true

      - name: Upload backend coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          files: ./src-tauri/rust-lcov.info
          flags: backend
          fail_ci_if_error: true
